<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} — Documents</title>
  <style>
    body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
           background:#0f1220; color:#e7e9f3; }
    header { padding:1.25rem 2rem; border-bottom:1px solid #262c4a; font-weight:700; }
    main { max-width:760px; margin:0 auto; padding:2.5rem 1.5rem; }
    h1 { margin-top:0; }
    ul { list-style:none; padding:0; }
    li { background:#1a1f36; border:1px solid #262c4a; border-radius:10px;
         margin:.5rem 0; }
    li a { display:block; padding:.9rem 1.1rem; color:#cdd4ff;
           text-decoration:none; }
    li a:hover { background:#222a4d; }
    .back { color:#9aa3c7; text-decoration:none; }
  </style>
</head>
<body>
  <header>{{ app_name }}</header>
  <main>
    <p><a class="back" href="{{ url_for('index') }}">&larr; Back to portal</a></p>
    <h1>Shared Documents</h1>
    <ul>
      {% for key in keys %}
      <li><a href="{{ url_for('view', key=key) }}">{{ key }}</a></li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
